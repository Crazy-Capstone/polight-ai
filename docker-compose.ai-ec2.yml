# AI 전용 EC2 배포용. Spring과 다른 EC2이므로 Docker 네트워크를 공유하지 않는다.
# EC2 호스트의 8000 포트를 AI 컨테이너에 게시하고, 접근은 AWS 보안 그룹에서
# 백엔드 보안 그룹으로 제한한다.
services:
  ai:
    image: 767918718624.dkr.ecr.ap-northeast-2.amazonaws.com/polight-ai:latest
    container_name: polight-ai
    env_file: .env

    mem_limit: 1g
    mem_reservation: 256m
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ai-data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health', timeout=3).status_code==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  ai-data:
