name: Deploy AI to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.ai-ec2.yml"
      - ".github/workflows/deploy-ai.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 767918718624.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: polight-ai
  EC2_INSTANCE_ID: i-02840a97f40ca403e

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::767918718624:role/polight-ai-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy on AI EC2 through Systems Manager
        id: deploy
        run: |
          COMPOSE_B64=$(base64 -w0 docker-compose.ai-ec2.yml)
          PARAMETERS=$(jq -cn \
            --arg compose_b64 "$COMPOSE_B64" \
            --arg registry "$ECR_REGISTRY" \
            '{commands:[
              "set -e",
              "cd /home/ec2-user/polight-ai",
              ("printf %s " + ($compose_b64|@sh) + " | base64 -d > docker-compose.ai-ec2.yml"),
              "chown ec2-user:ec2-user docker-compose.ai-ec2.yml",
              ("aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin " + $registry),
              "docker compose -f docker-compose.ai-ec2.yml pull ai",
              "docker compose -f docker-compose.ai-ec2.yml up -d --no-build ai",
              "for i in $(seq 1 20); do if curl -fsS http://localhost:8000/health; then exit 0; fi; sleep 3; done; docker logs --tail 100 polight-ai; exit 1"
            ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy AI image from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Show deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
